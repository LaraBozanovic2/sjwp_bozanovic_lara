<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
        box-sizing: border-box; /* border box služi za zadržavanje istog kuta (300*300px) */
      }
      .prvi {
        background-color: blueviolet;
        border: 2px solid black; /* debljina, vrsta i boja */
        padding: 50px 60px; /* prva vrijednost je gore i dole druga vrijednost je lijevo i desno */
      }
      .drugi {
        background-color: cadetblue;
        margin: 20px 10px 5px 2px; /* smjer je kao kazaljka na satu (20px je gornja stranica, 10px desna...)*/
        border-radius: 5%; /* zaobljuje rubove  */
        /* border-radius: 50% služi za savršen krug */
        border: 3px solid blue; /* okvir na krugu */kkkkkk


      }
    </style>
  </head>
  <body>
    <div class="prvi">
      <!-- div element je kao box -->
      <p>Ovo je prvi paragraf u prvom div elementu</p>
    </div>
    <div class="drugi"></div>
    <!-- margin, padding, border -->
  </body>
</html>
