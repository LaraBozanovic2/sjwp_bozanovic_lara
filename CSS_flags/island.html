<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zastava Islanda</title>
    <style>
      .plava {
        background-color: blue;
        position: relative;
        width: 500px;
        height: 350px;
      }
      .bijela {
        background-color: white;
        position: absolute;
        width: 100px;
        height: 350px;
        left: 150px;
      }
      .bijela2 {
        background-color: white;
        position: absolute;
        width: 500px;
        height: 100px;
        top: 120px;
      }
      .crvena1 {
        background-color: red;
        position: absolute;
        width: 40px;
        height: 350px;
        left: 180px;
      }
      .crvena2 {
        background-color: red;
        position: absolute;
        width: 500px;
        height: 50px;
        top: 150px;
      }
    </style>
  </head>
  <body style="background-color: black">
    <div class="plava">
      <div class="bijela"></div>
      <div class="bijela2"></div>
      <div class="crvena1"></div>
      <div class="crvena2"></div>
    </div>
  </body>
</html>
