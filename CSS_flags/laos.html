<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zastava Laosa</title>
    <style>
      .plava {
        background-color: blue;
        width: 500px;
        height: 350px;
        position: relative;
      }
      .crvena {
        background-color: red;
        position: absolute;
        height: 100px;
        width: 500px;
      }
      .crvena2 {
        background-color: red;
        position: absolute;
        height: 100px;
        width: 500px;
        top: 250px;
      }
      .krug {
        width: 125px;
        height: 125px;
        background-color: white;
        position: absolute;
        top: 115px;
        left: 200px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="plava">
      <div class="crvena"></div>
      <div class="krug"></div>
      <div class="crvena2"></div>
    </div>
  </body>
</html>
