<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
      }
      .relative {
        background-color: chocolate;
        position: relative; /* gdje bi u počeku bio  */
      }
      .absolute {
        background-color: crimson;
        position: absolute; /* krajnja lijeva točka */
        top: 50px; /* koliko je dolje pomaknut */
        left: 50px; /* koliko desno je pomaknut */
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute"></div>
    </div>
  </body>
</html>
