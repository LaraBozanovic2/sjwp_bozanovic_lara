<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obrubi tablice</title>
    <style>
      a:link,
      a:visited {
        background-color: #f44336;
        color: white;
        padding: 15px 25px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
      }
      a:hover,
      a:active {
        background-color: red;
      }
      table {
        border: 3px solid #a52a2a;
        width: 100%;
        margin: auto;
      }
      th,
      td,
      th {
        border: 3px solid #a52a2a;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center; color: #191970">Obrubi tablice</h1>
    <h2 style="text-align: center; color: #191970">Raspored dodatne nastave</h2>
    <table style="margin: auto">
      <tr>
        <th>Hrvatski jezik</th>
        <th>Matematika</th>
        <th>Engleski jezik</th>
        <th>Njemački jezik</th>
      </tr>

      <tr>
        <td>Ponedjeljak</td>
        <td>Utorak</td>
        <td>Srijeda</td>
        <td>Četvrtak</td>
      </tr>

      <tr>
        <td>13:10-14:00</td>
        <td>12:10-12:45</td>
        <td>14:00-14:45</td>
        <td>13:10-14:00</td>
      </tr>
    </table>
    <hr />
    <a href="">Sljedeća stranica</a>
  </body>
</html>
