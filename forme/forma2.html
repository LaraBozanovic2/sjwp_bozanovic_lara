<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="text-align: center">Student Registration Form</h1>

    <label for="number">Roll no:</label>
    <input type="number" name="number" id="number" /> <br />
    <br />

    <label for="name">Student name:</label>
    <input type="name" name="name" id="name" /><br /><br />

    <label for="name1">Father's name:</label>
    <input type="name1" name="name1" id="name1" /><br /><br />

    <label for="date">Date of birth:</label>
    <input type="date" name="date" id="date" /><br /><br />

    <label for="broj">Mobile no.:</label>
    <input type="tel" name="broj" id="broj" /><br /><br />

    <label for="mail">Email id:</label>
    <input type="email" name="mail" id="mail" /><br /><br />

    <label for="pass">Password:</label>
    <input type="password" name="pass" id="pass" /><br /><br />

    <h2>Gender:</h2>
    <p>
      <input type="radio" name="gen" id="Male" />
      <label for="Male">Male</label>
    </p>
    <p>
      <input type="radio" name="gen" id=Female" />
      <label for="Male">Female</label>
    </p>

    <h2>Department</h2>

    <label for="F"></label>       <!--div ako želimo da sve bude ravno-->
  </body>
</html>
